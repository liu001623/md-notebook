<title>Markdown 笔记本</title>
<style>
  :root {
    --primary: #2f80ed;
    --primary-dark: #1c6dd0;
    --bg: #f3f8fc;
    --panel: #ffffff;
    --sidebar-bg: #f7fbfe;
    --border: #d4e3f0;
    --text: #2c3e50;
    --muted: #7a8a9a;
    --hover: #eaf2fb;
    --active: #d8e9fb;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; padding: 0; overscroll-behavior: none; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .icon-btn {
    width: 38px; height: 38px; border: none; background: transparent;
    border-radius: 8px; cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); flex-shrink: 0;
  }
  .icon-btn:active { background: var(--hover); }
  #pageTitle {
    flex: 1; border: 1px solid transparent; background: transparent;
    padding: 6px 8px; border-radius: 6px; outline: none;
    font-size: 16px; font-weight: 600; color: #1c3a5c;
    min-width: 0; text-overflow: ellipsis;
  }
  #pageTitle:focus { background: #fff; border-color: var(--primary); }

  /* ===== 工具栏（横向滚动） ===== */
  .toolbar {
    display: flex; gap: 6px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0; scrollbar-width: none;
  }
  .toolbar::-webkit-scrollbar { display: none; }
  .tg {
    display: flex; gap: 1px; padding: 2px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fbfdff; flex-shrink: 0;
  }
  .btn {
    min-width: 36px; height: 32px; padding: 0 8px;
    border: none; background: transparent; border-radius: 6px;
    cursor: pointer; color: var(--text); font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 3px;
    white-space: nowrap; font-family: inherit;
  }
  .btn:active { background: var(--active); }

  /* 色板 */
  .color-wrap { position: relative; display: inline-flex; }
  .swatches {
    position: fixed; left: 10px; right: 10px; bottom: 10px;
    display: none; grid-template-columns: repeat(8, 1fr); gap: 6px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; box-shadow: 0 -4px 20px rgba(0,0,0,.12); z-index: 60;
  }
  .color-wrap.open .swatches { display: grid; }
  .swatch { width: 100%; aspect-ratio: 1; min-height: 32px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(0,0,0,.1); }
  .swatch:active { transform: scale(0.92); }

  /* ===== 画布 ===== */
  .canvas-wrap {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 12px;
  }
  #canvas {
    max-width: 760px; margin: 0 auto; background: #fff;
    padding: 24px 20px; min-height: calc(100% - 0px);
    border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.05);
    outline: none; font-size: 16px; line-height: 1.75;
    word-wrap: break-word; overflow-wrap: break-word;
  }
  #canvas:empty::before {
    content: attr(data-placeholder); color: var(--muted); font-style: italic; pointer-events: none;
  }

  #canvas h1, #canvas h2, #canvas h3, #canvas h4 { color: #1c3a5c; margin: 1.2em 0 .5em; line-height: 1.3; word-wrap: break-word; }
  #canvas h1 { font-size: 1.7em; border-bottom: 2px solid #dbe9f7; padding-bottom: .25em; }
  #canvas h2 { font-size: 1.4em; border-bottom: 1px solid #e5eef8; padding-bottom: .2em; }
  #canvas h3 { font-size: 1.2em; }
  #canvas p { margin: .6em 0; }
  #canvas ul, #canvas ol { padding-left: 1.5em; margin: .5em 0; }
  #canvas li { margin: .25em 0; }
  #canvas blockquote {
    margin: .8em 0; padding: .5em .9em; border-left: 4px solid var(--primary);
    background: #f5faff; color: #4a6075; border-radius: 0 6px 6px 0;
  }
  #canvas code {
    background: #f3f6fa; color: #c0342d; padding: 1px 5px; border-radius: 3px;
    font-family: ui-monospace, Menlo, monospace; font-size: .92em;
    word-break: break-word;
  }
  #canvas pre {
    background: #1e2937; color: #e2e8f0; padding: 12px 14px; border-radius: 8px;
    overflow-x: auto; margin: 1em 0; line-height: 1.5; -webkit-overflow-scrolling: touch;
  }
  #canvas pre code { background: transparent; color: inherit; padding: 0; white-space: pre; }
  #canvas a { color: var(--primary); word-break: break-all; }
  #canvas hr { border: none; border-top: 1px dashed #cdd9e5; margin: 1.4em 0; }
  #canvas table { border-collapse: collapse; margin: 1em 0; max-width: 100%; display: block; overflow-x: auto; }
  #canvas th, #canvas td { border: 1px solid var(--border); padding: 6px 10px; font-size: .95em; }
  #canvas th { background: #ecf4fb; }
  #canvas img { max-width: 100%; border-radius: 6px; }
  #canvas mark { background: #fff3a8; color: inherit; padding: 0 2px; border-radius: 2px; }
  #canvas .math-block {
    display: block; text-align: center; margin: 1em 0;
    padding: 8px; background: #fafcff; border-radius: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  #canvas .math-inline, #canvas .math-block { cursor: pointer; }
  #canvas mjx-container { overflow-x: auto; max-width: 100%; }

  /* ===== 状态栏 ===== */
  .statusbar {
    padding: 4px 12px; background: #ecf4fb; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between; flex-shrink: 0;
  }

  /* ===== 侧边抽屉 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    opacity: 0; visibility: hidden; transition: opacity .25s; z-index: 80;
  }
  .overlay.show { opacity: 1; visibility: visible; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 80%; max-width: 320px;
    background: var(--sidebar-bg); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .28s cubic-bezier(.2,.7,.3,1);
    z-index: 90; display: flex; flex-direction: column;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-header {
    padding: 12px; display: flex; gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .sb-btn {
    flex: 1; padding: 10px; border: 1px solid var(--border);
    background: #fff; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--text); font-family: inherit;
  }
  .sb-btn:active { background: var(--hover); }
  .sb-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .sidebar-title { padding: 12px 12px 6px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .sidebar-list {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 8px 8px; list-style: none; margin: 0;
  }
  .page-item {
    padding: 12px 10px; margin-bottom: 4px; border-radius: 8px;
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid transparent;
  }
  .page-item:active { background: var(--hover); }
  .page-item.active { background: var(--active); border-color: var(--primary); font-weight: 500; }
  .page-item .pi-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-item .pi-del {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); border-radius: 6px; font-size: 14px; flex-shrink: 0;
  }
  .page-item .pi-del:active { background: #f5c6c6; color: #c0392b; }
  .empty-tip { padding: 30px 12px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }

  /* ===== 更多菜单（底部 sheet） ===== */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #fff; border-radius: 16px 16px 0 0;
    padding: 8px 0 calc(12px + var(--safe-bottom));
    transform: translateY(100%); transition: transform .25s;
    z-index: 95; box-shadow: 0 -4px 24px rgba(0,0,0,.15);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px; background: #d0dae5; border-radius: 2px;
    margin: 6px auto 8px;
  }
  .sheet-item {
    padding: 14px 20px; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
  }
  .sheet-item:active { background: var(--hover); }
  .sheet-item.danger { color: #c0392b; }
  .sheet-item .si-icon { font-size: 18px; width: 24px; text-align: center; }
  .sheet-cancel {
    margin: 8px 12px 0; padding: 14px; text-align: center;
    background: var(--bg); border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .sheet-cancel:active { background: var(--hover); }

  /* ===== 公式模态（底部 sheet） ===== */
  .math-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; top: 40%;
    background: #fff; border-radius: 16px 16px 0 0;
    padding: 12px 16px calc(16px + var(--safe-bottom));
    transform: translateY(100%); transition: transform .25s;
    z-index: 95; box-shadow: 0 -4px 24px rgba(0,0,0,.15);
    display: flex; flex-direction: column;
  }
  .math-sheet.show { transform: translateY(0); }
  .math-sheet h3 { margin: 4px 0 10px; color: #1c3a5c; font-size: 15px; text-align: center; }
  .math-sheet textarea {
    width: 100%; flex: 0 0 auto; height: 70px; padding: 10px;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: ui-monospace, Menlo, monospace; font-size: 16px;
    resize: none; outline: none;
  }
  .math-sheet textarea:focus { border-color: var(--primary); }
  .math-hint { font-size: 11px; color: var(--muted); margin: 6px 0; }
  .math-preview {
    flex: 1; margin: 6px 0; padding: 14px; background: var(--bg);
    border-radius: 8px; min-height: 60px; border: 1px solid var(--border);
    text-align: center; overflow: auto; -webkit-overflow-scrolling: touch;
  }
  .math-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .math-actions button {
    flex: 1; padding: 12px; border: 1px solid var(--border);
    background: #fff; border-radius: 10px; cursor: pointer;
    font-size: 15px; font-family: inherit;
  }
  .math-actions button:active { background: var(--hover); }
  .math-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

  input[type="file"] { display: none; }
</style>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
    startup: { typeset: false }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="菜单">☰</button>
    <input id="pageTitle" placeholder="页面标题..." />
    <button class="icon-btn" id="moreBtn" aria-label="更多">⋯</button>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="tg">
      <button class="btn" data-cmd="formatBlock" data-val="H1">H1</button>
      <button class="btn" data-cmd="formatBlock" data-val="H2">H2</button>
      <button class="btn" data-cmd="formatBlock" data-val="H3">H3</button>
      <button class="btn" data-cmd="formatBlock" data-val="P">正文</button>
    </div>
    <div class="tg">
      <button class="btn" data-cmd="bold"><b>B</b></button>
      <button class="btn" data-cmd="italic"><i>I</i></button>
      <button class="btn" data-cmd="strikeThrough"><s>S</s></button>
      <button class="btn" data-cmd="code">&lt;/&gt;</button>
    </div>
    <div class="tg">
      <button class="btn" data-cmd="insertUnorderedList">• 列表</button>
      <button class="btn" data-cmd="insertOrderedList">1. 列表</button>
      <button class="btn" data-cmd="formatBlock" data-val="BLOCKQUOTE">引用</button>
    </div>
    <div class="tg">
      <span class="color-wrap" id="colorWrap">
        <button class="btn" id="colorBtn">⬤色</button>
        <div class="swatches" id="colorSwatches"></div>
      </span>
      <span class="color-wrap" id="hlWrap">
        <button class="btn" id="hlBtn">🖍亮</button>
        <div class="swatches" id="hlSwatches"></div>
      </span>
    </div>
    <div class="tg">
      <button class="btn" data-action="mathInline">$x$</button>
      <button class="btn" data-action="mathBlock">$$块$$</button>
    </div>
    <div class="tg">
      <button class="btn" data-action="link">🔗</button>
      <button class="btn" data-action="table">表格</button>
      <button class="btn" data-cmd="insertHorizontalRule">──</button>
      <button class="btn" data-action="codeBlock">```</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <div id="canvas" contenteditable="true" spellcheck="false" data-placeholder="点击此处开始编写…"></div>
  </div>

  <div class="statusbar">
    <span id="statLeft">页面数: 0</span>
    <span id="statRight">就绪</span>
  </div>
</div>

<!-- 侧边抽屉 -->
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="sb-btn primary" id="newPageBtn">+ 新建</button>
    <button class="sb-btn" id="importBtn">📥 导入</button>
  </div>
  <div class="sidebar-title">📝 页面列表</div>
  <ul class="sidebar-list" id="pageList"></ul>
</aside>

<!-- 更多菜单 -->
<div class="overlay" id="moreOverlay"></div>
<div class="sheet" id="moreSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-item" id="mNew"><span class="si-icon">📄</span>新建页面</div>
  <div class="sheet-item" id="mImport"><span class="si-icon">📥</span>导入 .md 文件</div>
  <div class="sheet-item" id="mExport"><span class="si-icon">⬇</span>导出当前页为 .md</div>
  <div class="sheet-item danger" id="mDelete"><span class="si-icon">🗑</span>删除当前页</div>

<!-- 公式 sheet -->
<div class="overlay" id="mathOverlay"></div>
<div class="math-sheet" id="mathSheet">
  <h3 id="mathSheetTitle">插入公式</h3>
  <textarea id="mathInput" placeholder="输入 LaTeX，例如：\frac{a}{b} + c"></textarea>
  <div class="math-hint">行内 $…$，块级 $$…$$；双击已插入的公式可重新编辑</div>
  <div class="math-preview" id="mathPreview">预览区</div>

    <button id="mathCancel">取消</button>

  </div>

<input type="file" id="fileInput" accept=".md,.txt,.markdown">

<script>
/* ========== 数据 ========== */
const STORAGE_KEY = 'md-notebook-mobile-v1';
let state = { pages: [], currentId: null };
let saveTimer = null;

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) state = JSON.parse(s);
  } catch (e) {}
  if (!state.pages || !Array.isArray(state.pages)) state.pages = [];
  if (!state.pages.length) {
    const id = 'p_' + Date.now();
    state.pages = [{ id, title: '欢迎使用', html: getDefaultHtml(), createdAt: Date.now(), updatedAt: Date.now() }];
    state.currentId = id;
  }
  if (!state.currentId || !state.pages.find(p => p.id === state.currentId)) {
    state.currentId = state.pages[0].id;
  }
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 500); }

function getDefaultHtml() {
  return `<h1>Markdown 笔记本</h1>
<p>手机版 PWA 笔记本，<strong>所见即所得</strong>，工具栏直接对选中文字生效。</p>
<h2>核心功能</h2>
<ul>
<li>📱 <strong>多页面管理</strong>：左上角 ☰ 打开侧边栏，可新建/导入/删除</li>
<li>✏️ <strong>所见即所得</strong>：渲染区即编辑区，选中文字点工具栏即可</li>
<li>🎨 <strong>颜色与高亮</strong>：<span style="color:#e74c3c">彩色文字</span>、<mark>荧光高亮</mark></li>
<li>𝑥² <strong>数学公式</strong>：行内 <span class="math-inline" data-latex="x^2+y^2=r^2" contenteditable="false"></span>，块级公式：</li>
</ul>
<span class="math-block" data-latex="\\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}" contenteditable="false"></span>
<h2>使用提示</h2>
<ol>
<li>选中文字后点工具栏按钮应用样式（横滑查看更多）</li>
<li>点右上角 ⋯ 打开菜单：新建/导入/导出/删除</li>
<li><strong>双击公式</strong>可重新编辑 LaTeX 源码</li>
<li>可「添加到主屏幕」当 App 用，全屏体验</li>
<li>内容自动保存在浏览器本地，断网也能编辑</li>
</ol>
<blockquote>首次打开需联网加载 MathJax（约 1 秒），之后 Safari 会缓存。</blockquote>`;
}

/* ========== DOM ========== */
const pageList = document.getElementById('pageList');
const pageTitle = document.getElementById('pageTitle');
const canvas = document.getElementById('canvas');
const statLeft = document.getElementById('statLeft');
const statRight = document.getElementById('statRight');
const overlay = document.getElementById('overlay');
const sidebar = document.getElementById('sidebar');

/* ========== 侧边栏 ========== */
function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);

function renderPageList() {
  pageList.innerHTML = '';
  if (!state.pages.length) {
    pageList.innerHTML = '<li class="empty-tip">暂无页面<br>点击「+ 新建」或「📥 导入」</li>';
    statLeft.textContent = '页面数: 0';
    return;
  }
  state.pages.forEach(p => {
    const li = document.createElement('li');
    li.className = 'page-item' + (p.id === state.currentId ? ' active' : '');
    li.dataset.id = p.id;
    li.innerHTML = `<span>📄</span><span class="pi-title"></span><span class="pi-del">✕</span>`;
    li.querySelector('.pi-title').textContent = p.title || '未命名';
    li.addEventListener('click', (e) => {
      if (e.target.classList.contains('pi-del')) { e.stopPropagation(); deletePage(p.id); }
      else { switchPage(p.id); closeSidebar(); }
    });
    pageList.appendChild(li);
  });
  statLeft.textContent = `页面数: ${state.pages.length}`;
}

function switchPage(id) {
  saveCurrentPage();
  const p = state.pages.find(x => x.id === id);
  if (!p) return;
  state.currentId = id;
  pageTitle.value = p.title;
  canvas.innerHTML = p.html || '';
  renderMathInCanvas();
  renderPageList();
  saveState();
}
function saveCurrentPage() {
  if (!state.currentId) return;
  const p = state.pages.find(x => x.id === state.currentId);
  if (!p) return;
  p.html = canvas.innerHTML;
  p.title = pageTitle.value || '未命名';
  p.updatedAt = Date.now();
  scheduleSave();
}
function newPage() {
  saveCurrentPage();
  const id = 'p_' + Date.now();
  const p = { id, title: '新页面', html: '<p><br></p>', createdAt: Date.now(), updatedAt: Date.now() };
  state.pages.push(p);
  state.currentId = id;
  pageTitle.value = p.title;
  canvas.innerHTML = p.html;
  renderPageList(); saveState();
  closeMoreSheet();
  setTimeout(() => {
    canvas.focus();
    const r = document.createRange(); r.selectNodeContents(canvas); r.collapse(true);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }, 100);
}
function deletePage(id) {
  const p = state.pages.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`删除页面「${p.title || '未命名'}」？此操作不可撤销。`)) return;
  state.pages = state.pages.filter(x => x.id !== id);
  if (state.currentId === id) {
    state.currentId = state.pages[0] ? state.pages[0].id : null;
    if (state.currentId) {
      const np = state.pages.find(x => x.id === state.currentId);
      pageTitle.value = np.title; canvas.innerHTML = np.html || ''; renderMathInCanvas();
    } else { pageTitle.value = ''; canvas.innerHTML = ''; }
  }
  renderPageList(); saveState();
}

/* ========== 导入 ========== */
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    saveCurrentPage();
    const md = reader.result;
    let html; try { html = marked.parse(md); } catch (err) { html = '<p>解析失败</p>'; }
    html = wrapMathInHtml(html);
    const id = 'p_' + Date.now();
    const title = file.name.replace(/\.(md|markdown|txt)$/i, '');
    state.pages.push({ id, title, html, createdAt: Date.now(), updatedAt: Date.now() });
    state.currentId = id;
    pageTitle.value = title; canvas.innerHTML = html;
    renderMathInCanvas(); renderPageList(); saveState();
    statRight.textContent = '已导入: ' + file.name;
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});
function wrapMathInHtml(html) {
  html = html.replace(/\$\$([\s\S]+?)\$\$/g, (m, l) => `<span class="math-block" data-latex="${escapeAttr(l)}" contenteditable="false"></span>`);
  html = html.replace(/\$([^\$\n]+?)\$/g, (m, l) => `<span class="math-inline" data-latex="${escapeAttr(l)}" contenteditable="false"></span>`);
  return html;
}

/* ========== 公式渲染 ========== */
function renderMathInCanvas() {
  const els = canvas.querySelectorAll('.math-inline[data-latex], .math-block[data-latex]');
  if (!els.length) return;
  els.forEach(el => {
    const l = el.getAttribute('data-latex') || ''; if (!l) return;
    el.innerHTML = el.classList.contains('math-block') ? `$$${l}$$` : `$${l}$`;
  });
  if (window.MathJax && MathJax.typesetPromise) {
    if (MathJax.typesetClear) MathJax.typesetClear([...els]);
    MathJax.typesetPromise([...els])
      .then(() => { statRight.textContent = '公式已渲染 · ' + new Date().toLocaleTimeString(); })
      .catch(e => { statRight.textContent = '公式错误'; });
  } else { setTimeout(renderMathInCanvas, 400); }
}

/* ========== 工具栏 ========== */
document.execCommand('styleWithCSS', false, true);
function exec(cmd, val) { canvas.focus(); document.execCommand(cmd, false, val); saveCurrentPage(); }

// touchstart 阻止按钮获焦，保留画布选区
document.getElementById('toolbar').addEventListener('touchstart', (e) => {
  const btn = e.target.closest('.btn'); if (btn) e.preventDefault();
}, { passive: false });
document.getElementById('toolbar').addEventListener('mousedown', (e) => {
  const btn = e.target.closest('.btn'); if (btn) e.preventDefault();
});
document.getElementById('toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest('.btn'); if (!btn) return;
  document.querySelectorAll('.color-wrap').forEach(w => w.classList.remove('open'));
  const cmd = btn.dataset.cmd, action = btn.dataset.action, val = btn.dataset.val;
  if (cmd === 'code') return wrapInlineCode();
  if (cmd) return exec(cmd, val);
  if (action === 'mathInline') return openMathSheet(false);
  if (action === 'mathBlock') return openMathSheet(true);
  if (action === 'link') { const u = prompt('链接地址：', 'https://'); if (u) exec('createLink', u); return; }
  if (action === 'table') return insertTable();
  if (action === 'codeBlock') return insertCodeBlock();
});

function wrapInlineCode() {
  const sel = window.getSelection(); if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const code = document.createElement('code');
  if (range.collapsed) { code.textContent = '代码'; range.insertNode(code); range.setStart(code.firstChild,0); range.setEnd(code.firstChild,code.textContent.length); }
  else { try { code.appendChild(range.extractContents()); range.insertNode(code); } catch(e){} }
  saveCurrentPage();
}
function insertTable() {
  let h = '<table><thead><tr>'; for (let c=0;c<3;c++) h += '<th>标题'+(c+1)+'</th>';
  h += '</tr></thead><tbody>'; for (let r=0;r<2;r++){ h+='<tr>'; for(let c=0;c<3;c++) h+='<td>&nbsp;</td>'; h+='</tr>'; }
  h += '</tbody></table><p><br></p>'; insertHtmlAtCursor(h);
}
function insertCodeBlock() { insertHtmlAtCursor('<pre><code>// 代码\nfunction hello() {\n  console.log("hi");\n}</code></pre><p><br></p>'); }
function insertHtmlAtCursor(html) {
  canvas.focus();
  const sel = window.getSelection();
  if (sel.rangeCount && canvas.contains(sel.anchorNode)) {
    const range = sel.getRangeAt(0); range.deleteContents();
    const frag = range.createContextualFragment(html);
    const last = frag.lastChild; range.insertNode(frag);
    if (last) { range.setStartAfter(last); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); }
  } else { canvas.insertAdjacentHTML('beforeend', html); }
  saveCurrentPage();
}

/* ========== 色板 ========== */
const COLORS = ['#e74c3c','#e67e22','#f39c12','#27ae60','#16a085','#2980b9','#8e44ad','#34495e','#c0392b','#d35400','#7f8c8d','#1abc9c','#2c3e50','#e84393','#0984e3','#6c5ce7'];
const HIGHLIGHTS = ['#fff3a8','#c6f7c6','#bdeaff','#ffd1e0','#e0d4ff','#ffd9b3','#a0ffe0','#ffc9de'];
function buildSwatches(container, colors, applyFn) {
  container.innerHTML = '';
  colors.forEach(c => {
    const el = document.createElement('div'); el.className = 'swatch';
    el.style.background = c; el.title = c;
    el.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    el.addEventListener('mousedown', (e) => e.preventDefault());
    el.addEventListener('click', (ev) => { ev.stopPropagation(); applyFn(c); });
    container.appendChild(el);
  });
}
const colorWrap = document.getElementById('colorWrap'), hlWrap = document.getElementById('hlWrap');
buildSwatches(document.getElementById('colorSwatches'), COLORS, (c) => { colorWrap.classList.remove('open'); exec('foreColor', c); });
buildSwatches(document.getElementById('hlSwatches'), HIGHLIGHTS, (c) => { hlWrap.classList.remove('open'); exec('hiliteColor', c); });
document.getElementById('colorBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const o = colorWrap.classList.contains('open');
  document.querySelectorAll('.color-wrap').forEach(w => w.classList.remove('open'));
  if (!o) colorWrap.classList.add('open');
});
document.getElementById('hlBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const o = hlWrap.classList.contains('open');
  document.querySelectorAll('.color-wrap').forEach(w => w.classList.remove('open'));
  if (!o) hlWrap.classList.add('open');
});
document.addEventListener('click', (e) => { if (!e.target.closest('.color-wrap')) document.querySelectorAll('.color-wrap').forEach(w => w.classList.remove('open')); });

/* ========== 公式 sheet ========== */
let mathCtx = { block: false, editingEl: null };
const mathSheet = document.getElementById('mathSheet');
const mathOverlay = document.getElementById('mathOverlay');
const mathInput = document.getElementById('mathInput');
const mathPreview = document.getElementById('mathPreview');
const mathSheetTitle = document.getElementById('mathSheetTitle');

function openMathSheet(block, editingEl) {
  mathCtx = { block: !!block, editingEl: editingEl || null };
  mathSheetTitle.textContent = editingEl ? '编辑公式' : (block ? '插入块级公式' : '插入行内公式');
  mathInput.value = editingEl ? (editingEl.getAttribute('data-latex') || '') : '';
  mathSheet.classList.add('show'); mathOverlay.classList.add('show');
  setTimeout(() => mathInput.focus(), 200);
  updateMathPreview();
}
function closeMathSheet() {
  mathSheet.classList.remove('show'); mathOverlay.classList.remove('show');
  mathInput.value = ''; mathPreview.innerHTML = '预览区'; mathCtx.editingEl = null;
}
function updateMathPreview() {
  const l = mathInput.value.trim();
  if (!l) { mathPreview.innerHTML = '<span style="color:#999">预览区</span>'; return; }
  mathPreview.innerHTML = mathCtx.block ? `$$${l}$$` : `$${l}$`;
  if (window.MathJax && MathJax.typesetPromise) {
    if (MathJax.typesetClear) MathJax.typesetClear([mathPreview]);
    MathJax.typesetPromise([mathPreview]).catch(()=>{});
  }
}
mathInput.addEventListener('input', updateMathPreview);
document.getElementById('mathInsert').addEventListener('click', () => {
  const l = mathInput.value.trim(); if (!l) { closeMathSheet(); return; }
  const isBlock = mathCtx.block, editingEl = mathCtx.editingEl;
  if (editingEl) {
    editingEl.setAttribute('data-latex', l);
    editingEl.innerHTML = isBlock ? `$$${l}$$` : `$${l}$`;
    if (MathJax.typesetPromise) { if (MathJax.typesetClear) MathJax.typesetClear([editingEl]); MathJax.typesetPromise([editingEl]).catch(()=>{}); }
  } else {
    const el = document.createElement('span');
    el.className = isBlock ? 'math-block' : 'math-inline';
    el.setAttribute('contenteditable', 'false'); el.setAttribute('data-latex', l);
    el.innerHTML = isBlock ? `$$${l}$$` : `$${l}$`;
    insertHtmlAtCursor('');
    const sel = window.getSelection();
    if (sel.rangeCount && canvas.contains(sel.anchorNode)) {
      const range = sel.getRangeAt(0); range.deleteContents(); range.insertNode(el);
      const after = document.createTextNode('\u00a0');
      el.parentNode.insertBefore(after, el.nextSibling);
      range.setStartAfter(after); range.collapse(true); sel.removeAllRanges(); sel.addRange(range);
    } else { canvas.appendChild(el); canvas.appendChild(document.createTextNode('\u00a0')); }
    if (MathJax.typesetPromise) { if (MathJax.typesetClear) MathJax.typesetClear([el]); MathJax.typesetPromise([el]).catch(()=>{}); }
  }
  saveCurrentPage(); closeMathSheet();
});
document.getElementById('mathCancel').addEventListener('click', closeMathSheet);
mathOverlay.addEventListener('click', closeMathSheet);
canvas.addEventListener('dblclick', (e) => {
  const el = e.target.closest('.math-inline, .math-block');
  if (el) { e.preventDefault(); e.stopPropagation(); openMathSheet(el.classList.contains('math-block'), el); }
});
// iOS 长按触发编辑公式
let longPressTimer = null;
canvas.addEventListener('touchstart', (e) => {
  const el = e.target.closest('.math-inline, .math-block');
  if (el) {
    longPressTimer = setTimeout(() => {
      e.preventDefault();
      openMathSheet(el.classList.contains('math-block'), el);
    }, 500);
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });
canvas.addEventListener('touchmove', () => { if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } });

/* ========== 更多菜单 ========== */
const moreSheet = document.getElementById('moreSheet'), moreOverlay = document.getElementById('moreOverlay');
function openMoreSheet() { moreSheet.classList.add('show'); moreOverlay.classList.add('show'); }
function closeMoreSheet() { moreSheet.classList.remove('show'); moreOverlay.classList.remove('show'); }
document.getElementById('moreBtn').addEventListener('click', openMoreSheet);
moreOverlay.addEventListener('click', closeMoreSheet);
document.getElementById('mCancel').addEventListener('click', closeMoreSheet);
document.getElementById('mNew').addEventListener('click', newPage);
document.getElementById('mImport').addEventListener('click', () => { closeMoreSheet(); document.getElementById('fileInput').click(); });
document.getElementById('mDelete').addEventListener('click', () => { closeMoreSheet(); if (state.currentId) deletePage(state.currentId); });
document.getElementById('mExport').addEventListener('click', () => {
  saveCurrentPage();
  const p = state.pages.find(x => x.id === state.currentId);
  if (!p) { alert('请先选择一个页面'); return; }
  const md = htmlToMd(p.html);
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = (p.title || '页面') + '.md';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeMoreSheet();
  statRight.textContent = '已导出: ' + a.download;
});

document.getElementById('newPageBtn').addEventListener('click', () => { newPage(); closeSidebar(); });
document.getElementById('importBtn').addEventListener('click', () => { closeSidebar(); document.getElementById('fileInput').click(); });

/* ========== HTML → Markdown ========== */
function htmlToMd(html) {
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  return processNode(tmp).replace(/\n{3,}/g, '\n\n').trim() + '\n';
  function processNode(node) {
    let md = '';
    node.childNodes.forEach(child => {
      if (child.nodeType === 3) { md += child.textContent.replace(/\n/g, ' '); }
      else if (child.nodeType === 1) {
        const tag = child.tagName.toLowerCase(), inner = processNode(child);
        switch (tag) {
          case 'h1': md += '\n# ' + inner.trim() + '\n\n'; break;
          case 'h2': md += '\n## ' + inner.trim() + '\n\n'; break;
          case 'h3': md += '\n### ' + inner.trim() + '\n\n'; break;
          case 'h4': md += '\n#### ' + inner.trim() + '\n\n'; break;
          case 'strong': case 'b': md += '**' + inner + '**'; break;
          case 'em': case 'i': md += '*' + inner + '*'; break;
          case 's': case 'del': md += '~~' + inner + '~~'; break;
          case 'code': md += '`' + inner + '`'; break;
          case 'pre': md += '\n```\n' + inner.trim() + '\n```\n\n'; break;
          case 'blockquote': md += '\n> ' + inner.trim().replace(/\n/g, '\n> ') + '\n\n'; break;
          case 'ul':
            child.querySelectorAll(':scope > li').forEach(li => { md += '- ' + processNode(li).trim() + '\n'; });
            md += '\n'; break;
          case 'ol':
            let i = 1; child.querySelectorAll(':scope > li').forEach(li => { md += (i++) + '. ' + processNode(li).trim() + '\n'; });
            md += '\n'; break;
          case 'li': md += inner; break;
          case 'p': md += '\n' + inner + '\n\n'; break;
          case 'br': md += '\n'; break;
          case 'hr': md += '\n---\n\n'; break;
          case 'a': md += '[' + inner + '](' + (child.getAttribute('href') || '') + ')'; break;
          case 'img': md += '![' + (child.alt||'') + '](' + (child.getAttribute('src') || '') + ')'; break;
          case 'table': md += '\n' + tableToMd(child) + '\n\n'; break;
          case 'mark': md += '==' + inner + '=='; break;
          case 'span': case 'div':
            if (child.classList && (child.classList.contains('math-inline') || child.classList.contains('math-block'))) {
              const l = child.getAttribute('data-latex') || '';
              md += child.classList.contains('math-block') ? `$$${l}$$` : `$${l}$`;
            } else md += inner;
            break;
          default: md += inner;
        }
      }
    });
    return md;
  }
  function tableToMd(table) {
    const rows = table.querySelectorAll('tr'); if (!rows.length) return '';
    let result = '';
    rows.forEach((row, i) => {
      const cells = row.querySelectorAll('th, td');
      result += '| ' + Array.from(cells).map(c => processNode(c).trim().replace(/\|/g,'\\|')).join(' | ') + ' |\n';
      if (i === 0) result += '|' + Array.from(cells).map(() => ' --- ').join('|') + '|\n';
    });
    return result;
  }
}

/* ========== 画布事件 ========== */
pageTitle.addEventListener('input', () => {
  saveCurrentPage();
  const li = pageList.querySelector('.page-item.active .pi-title');
  if (li) li.textContent = pageTitle.value || '未命名';
});
canvas.addEventListener('input', saveCurrentPage);
canvas.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === 'b') { e.preventDefault(); exec('bold'); }
    else if (k === 'i') { e.preventDefault(); exec('italic'); }
    else if (k === 's') { e.preventDefault(); document.getElementById('mExport').click(); }
  }
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
});

function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ========== 阻止双指缩放（iOS PWA 全屏体验） ========== */
document.addEventListener('gesturestart', (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

/* ========== 初始化 ========== */
loadState();
renderPageList();
const cur = state.pages.find(p => p.id === state.currentId);
if (cur) { pageTitle.value = cur.title; canvas.innerHTML = cur.html || ''; renderMathInCanvas(); }

// PWA：注册 service worker（若部署到 https 站点时生效；file:// 下静默失败）
if ('serviceWorker' in navigator) {
  try {
    const swCode = `
      const C='md-notebook-v1';
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.open(C).then(c => c.match(e.request).then(r => {
            const fetcher = fetch(e.request).then(res => { if (res && res.ok) c.put(e.request, res.clone()); return res; }).catch(()=>r);
            return r || fetcher;
          }))
        );
      });
    `;
    const swUrl = URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }));
    navigator.serviceWorker.register(swUrl).catch(() => {});
  } catch (e) {}
}
